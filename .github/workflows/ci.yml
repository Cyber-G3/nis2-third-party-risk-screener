name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Tests + coverage
        run: pytest --cov=tpr_screener --cov-report=term-missing --cov-fail-under=80
      - name: Bandit
        run: bandit -q -r src
      - name: Dependency audit
        run: pip-audit
      - name: Build wheel and sdist
        run: python -m build
